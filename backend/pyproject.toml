[project]
name = "ariadne"
version = "0.1.0"
description = "Parser + GraphRAG engine for zero-day impact analysis and remediation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "neo4j>=5.25",
    "qdrant-client>=1.12",
    "networkx>=3.4",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pypdf>=5.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live Neo4j/Qdrant (see root docker-compose.yml) and, for the mitigation-keyword checks, GEMINI_API_KEY",
]
